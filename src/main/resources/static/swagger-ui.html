<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documentación de la API — Peliculas</title>
    <link rel="stylesheet" href="/webjars/swagger-ui/5.17.14/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="/webjars/swagger-ui/5.17.14/swagger-ui-bundle.js"></script>
<script src="/webjars/swagger-ui/5.17.14/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            urls: [
                { url: "/contratos/carrito-api.yml", name: "Carrito" },
                { url: "/contratos/compras-api.yml", name: "Compras" }
            ],
            dom_id: "#swagger-ui",
            persistAuthorization: true,
            docExpansion: "none"
        });
    };
</script>
</body>
</html>
