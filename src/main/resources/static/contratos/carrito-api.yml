openapi: 3.0.3
info:
  title: Contrato carrito
  description: Endpoints del carrito del cliente autenticado. El usuario siempre se deduce del token JWT (ningun endpoint acepta usuario por cuerpo o ruta). Los errores usan el cuerpo uniforme ProblemDetail (RFC 9457) {type, title, status, detail, instance, errors}, producido por el GlobalExceptionHandler de la aplicacion.
  version: 1.0.0
tags:
  - name: CartHttp
    description: Carrito del usuario actual
paths:
  /api/carrito:
    get:
      tags: [CartHttp]
      operationId: viewCart
      summary: Carrito actual (vacio con total cero si aun no existe)
      responses:
        '200':
          description: Carrito del usuario, con el precio vivo de cada pelicula y el total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                lineas:
                  - peliculaId: 1
                    titulo: Alien
                    precio: 12.99
                total: 12.99
        '401':
          $ref: '#/components/responses/NoAutenticado'
    delete:
      tags: [CartHttp]
      operationId: clearCart
      summary: Vacia el carrito (idempotente)
      responses:
        '204':
          description: Carrito vaciado
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /api/carrito/lineas:
    post:
      tags: [CartHttp]
      operationId: addLine
      summary: Anade una pelicula al carrito (crea el carrito si es la primera)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartLineRequest'
            example:
              peliculaId: 1
      responses:
        '201':
          description: Linea anadida, con el precio actual de la pelicula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLineResponse'
              example:
                peliculaId: 1
                titulo: Alien
                precio: 12.99
        '400':
          $ref: '#/components/responses/CuerpoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/PeliculaInexistente'
        '409':
          $ref: '#/components/responses/ConflictoLinea'
  /api/carrito/lineas/{peliculaId}:
    delete:
      tags: [CartHttp]
      operationId: removeLine
      summary: Quita una pelicula del carrito
      parameters:
        - name: peliculaId
          in: path
          required: true
          description: Identificador de la pelicula a quitar
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Linea eliminada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/LineaInexistente'
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NoAutenticado:
      description: Sin token o token invalido o caducado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: No autenticado
    CuerpoInvalido:
      description: El cuerpo no incluye un identificador de pelicula valido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Peticion invalida
            errors:
              - 'peliculaId: debe ser positivo'
    PeliculaInexistente:
      description: La pelicula no existe en el catalogo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Recurso no encontrado
    LineaInexistente:
      description: La pelicula no esta en el carrito del usuario
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Recurso no encontrado
    ConflictoLinea:
      description: La pelicula ya esta en el carrito o no tiene precio y no es comprable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: La pelicula ya esta en el carrito
  schemas:
    CartResponse:
      type: object
      description: Carrito del usuario; el precio de cada linea es el precio vivo de la pelicula
      required: [lineas, total]
      properties:
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/CartLineResponse'
        total:
          type: number
          description: Suma de los precios actuales de las lineas; cero si el carrito esta vacio
          multipleOf: 0.01
          example: 12.99
    CartLineResponse:
      type: object
      required: [peliculaId, titulo, precio]
      properties:
        peliculaId:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: Alien
        precio:
          type: number
          description: Precio vivo de la pelicula al consultar
          multipleOf: 0.01
          example: 12.99
    AddCartLineRequest:
      type: object
      required: [peliculaId]
      properties:
        peliculaId:
          type: integer
          format: int64
          example: 1
    ErrorResponse:
      type: object
      description: Cuerpo uniforme de error en formato ProblemDetail (RFC 9457, application/problem+json), producido por el GlobalExceptionHandler
      required: [status, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: La pelicula ya esta en el carrito
        instance:
          type: string
          example: /api/carrito/lineas
        errors:
          type: array
          description: Solo en errores de validacion (400); una entrada "campo, dos puntos, mensaje" por campo rechazado
          items:
            type: string
          example: []
