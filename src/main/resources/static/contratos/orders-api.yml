openapi: 3.0.3
info:
  title: Contrato pedidos
  description: Creacion, consulta y cancelacion de pedidos. Crear un pedido reserva stock en el catalogo y captura el precio unitario de cada linea en ese momento; cancelarlo devuelve el stock. El usuario se deduce siempre del token; un pedido solo lo ven y cancelan su propietario (si no lo es, responde 404). Los errores usan el cuerpo uniforme ProblemDetail (RFC 9457) {type, title, status, detail, instance, errors}, producido por el GlobalExceptionHandler de la aplicacion.
  version: 0.3.0
tags:
  - name: OrderHttp
    description: Pedidos
paths:
  /api/orders:
    post:
      tags: [OrderHttp]
      operationId: createOrder
      summary: Crea un pedido y reserva el stock de todas sus lineas (o de ninguna)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido creado en estado CREATED, con el precio unitario capturado en cada linea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Peticion invalida (sin lineas, cantidad menor que 1, campos obligatorios ausentes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: Alguna linea referencia un producto que no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Stock insuficiente en alguna linea o producto sin precio; no se reserva nada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /api/orders/{id}:
    get:
      tags: [OrderHttp]
      operationId: getOrder
      summary: Consulta un pedido
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido con sus lineas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/OrderNotFound'
  /api/orders/{id}/cancel:
    post:
      tags: [OrderHttp]
      operationId: cancelOrder
      summary: Cancela un pedido en estado CREATED y devuelve su stock al catalogo
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: El pedido ya en estado CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: El pedido no esta en estado CREATED (por ejemplo, ya estaba cancelado)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    NoAutenticado:
      description: Sin token o token invalido o caducado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    OrderNotFound:
      description: El pedido no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
  schemas:
    CreateOrderRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderLineRequest'
    CreateOrderLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2
    OrderLineResponse:
      type: object
      required: [productId, title, unitPrice, quantity]
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          description: Titulo del producto en el momento del pedido
          example: Alien
        unitPrice:
          type: number
          description: Precio unitario capturado al reservar; no cambia aunque el producto se edite
          multipleOf: 0.01
          example: 12.99
        quantity:
          type: integer
          format: int32
          example: 2
    OrderResponse:
      type: object
      required: [id, userId, status, createdAt, total, lines]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        userId:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum: [CREATED, CANCELLED]
          example: CREATED
        createdAt:
          type: string
          format: date-time
          example: '2026-11-02T10:15:30Z'
        total:
          type: number
          description: Suma de unitPrice por quantity de todas las lineas
          multipleOf: 0.01
          example: 25.98
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'
    ErrorRespuesta:
      type: object
      description: Cuerpo uniforme de error en formato ProblemDetail (RFC 9457, application/problem+json), producido por el GlobalExceptionHandler
      required: [status, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: No hay stock suficiente del producto 1
        instance:
          type: string
          example: /api/orders
        errors:
          type: array
          description: Solo en errores de validacion (400); una entrada "campo, dos puntos, mensaje" por campo rechazado
          items:
            type: string
          example: []
