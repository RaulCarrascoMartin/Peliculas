spring.application.name=Peliculas

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/peliculas}
spring.datasource.username=${DB_USUARIO:peliculas}
spring.datasource.password=${DB_CONTRASENA:}
spring.jpa.hibernate.ddl-auto=update

peliculas.jwt.secreto=${JWT_SECRETO}
peliculas.jwt.caducidad=${JWT_CADUCIDAD:PT1H}

peliculas.admin.email=${ADMIN_EMAIL:}
peliculas.admin.contrasena=${ADMIN_CONTRASENA:}
