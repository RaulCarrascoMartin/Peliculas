spring.application.name=Peliculas

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/peliculas}
spring.datasource.username=${DB_USUARIO:peliculas}
spring.datasource.password=${DB_CONTRASENA:}

# The cart's optimistic lock (carritos.version) relies on a transaction reading a consistent snapshot: it is
# MariaDB's default, stated here so that any other database behaves the same.
spring.datasource.hikari.transaction-isolation=TRANSACTION_REPEATABLE_READ

peliculas.jwt.secreto=${JWT_SECRETO}
peliculas.jwt.caducidad=${JWT_CADUCIDAD:PT1H}

peliculas.admin.email=${ADMIN_EMAIL:}
peliculas.admin.contrasena=${ADMIN_CONTRASENA:}

# Schema: Flyway migrations in classpath:db/migration. A database created before Flyway (by the old init.sql) is
# baselined at version 1, so V1 is skipped there and only later migrations run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Spring Modulith: only packages with @ApplicationModule are modules
spring.modulith.detection-strategy=explicitly-annotated
